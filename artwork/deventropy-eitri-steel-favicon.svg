<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Deventropy Eitri Steel favicon</title>
  <desc id="desc">A geometric nested-brackets favicon for a JSON Schema and OpenAPI visual editor, using an interlocking hexagonal schema mark.</desc>
  <defs>
    <linearGradient id="outer" x1="180" y1="120" x2="850" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.55" stop-color="#94A3B8"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="inner" x1="315" y1="260" x2="720" y2="765" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)">
    <path d="M512 132 L812 304 L812 720 L512 892 L212 720 L212 304 Z" stroke="url(#outer)" stroke-width="84"/>
    <path d="M244 310 C188 310 154 344 154 400 L154 444 C154 478 134 500 104 512 C134 524 154 546 154 580 L154 624 C154 680 188 714 244 714" stroke="url(#outer)" stroke-width="92"/>
    <path d="M780 310 C836 310 870 344 870 400 L870 444 C870 478 890 500 920 512 C890 524 870 546 870 580 L870 624 C870 680 836 714 780 714" stroke="url(#outer)" stroke-width="92"/>
    <path d="M386 330 L306 330 L306 694 L386 694" stroke="url(#inner)" stroke-width="82"/>
    <path d="M638 330 L718 330 L718 694 L638 694" stroke="url(#inner)" stroke-width="82"/>
    <path d="M476 432 L396 512 L476 592" stroke="url(#inner)" stroke-width="70"/>
    <path d="M548 432 L628 512 L548 592" stroke="url(#inner)" stroke-width="70"/>
  </g>
</svg>